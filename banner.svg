<svg width="600" height="70" viewBox="0 0 600 70" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6f1ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3b2a66"/>
    </radialGradient>
  </defs>

  <!-- dense scattered twinkling starfield -->
  <circle cx="10" cy="10" r="1.1" fill="#bc8cff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="28" cy="52" r="0.9" fill="#58a6ff"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="16" r="0.7" fill="#e6f1ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="15" cy="34" r="0.8" fill="#bc8cff"><animate attributeName="opacity" values="1;0.4;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="60" r="0.6" fill="#58a6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="4" cy="48" r="0.6" fill="#e6f1ff"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="65" cy="40" r="0.8" fill="#bc8cff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>

  <circle cx="595" cy="14" r="1" fill="#58a6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="10" r="0.7" fill="#e6f1ff"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="475" cy="55" r="0.8" fill="#bc8cff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="20" r="0.6" fill="#58a6ff"><animate attributeName="opacity" values="1;0.4;1" dur="4.1s" repeatCount="indefinite"/></circle>

  <!-- constellation: small "wing" zigzag, top-left cluster -->
  <g stroke="#58a6ff" stroke-width="0.6" opacity="0.5">
    <line x1="10" y1="10" x2="28" y2="52"/>
    <line x1="28" y1="52" x2="55" y2="16"/>
    <line x1="55" y1="16" x2="15" y2="34"/>
    <line x1="15" y1="34" x2="4" y2="48"/>
    <line x1="55" y1="16" x2="65" y2="40"/>
  </g>

  <!-- small planet with an orbiting moon, right side -->
  <circle cx="540" cy="35" r="6.5" fill="url(#planetGrad)"/>
  <ellipse cx="540" cy="35" rx="14" ry="4.5" fill="none" stroke="#bc8cff" stroke-width="0.5" opacity="0.4"/>
  <g>
    <circle cx="554" cy="35" r="1.6" fill="#e6f1ff"/>
    <animateTransform attributeName="transform" type="rotate" from="0 540 35" to="360 540 35" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star streaking across -->
  <circle cx="0" cy="0" r="1.6" fill="#e6f1ff">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.6;0.65;0.75;1" dur="20s" repeatCount="indefinite"/>
    <animateMotion path="M 100,60 L 260,6" dur="20s" repeatCount="indefinite"/>
  </circle>
  <rect x="-14" y="-0.4" width="14" height="0.8" fill="url(#starGrad)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.6;0.65;0.75;1" dur="20s" repeatCount="indefinite"/>
    <animateMotion path="M 100,60 L 260,6" dur="20s" repeatCount="indefinite"/>
  </rect>

  <!-- cycling taglines, unique to Malak -->
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Building interfaces, thinking in systems
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Currently investigating LLM code security
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="4s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Also writing stories in Arabic, poetry in English
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="8s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Still learning Japanese, one kanji at a time
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="12s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Somewhere between a compiler and a constellation
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="16s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Reading, researching, wondering what's next
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="20s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Debugging by day, stargazing by night
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="24s" repeatCount="indefinite"/>
  </text>
  <text x="80" y="40" font-family="JetBrains Mono, monospace" font-size="15" fill="url(#textGrad)" opacity="0">
    Small steps, wide curiosity
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.016;0.109;0.125" dur="32s" begin="28s" repeatCount="indefinite"/>
  </text>
</svg>
