<svg width="700" height="100" viewBox="0 0 700 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6f1ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6f1ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3b2a66"/>
    </radialGradient>
    <radialGradient id="nebulaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#bc8cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- soft nebula clouds drifting in the background -->
  <ellipse cx="330" cy="45" rx="220" ry="55" fill="url(#nebulaGrad)" filter="url(#soften)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="140" cy="70" rx="120" ry="35" fill="url(#nebulaGrad)" filter="url(#soften)">
    <animate attributeName="opacity" values="1;0.5;1" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- dense scattered twinkling starfield -->
  <circle cx="14" cy="14" r="1.9" fill="#bc8cff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="34" cy="70" r="1.6" fill="#58a6ff"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="66" cy="20" r="1.3" fill="#e6f1ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="18" cy="46" r="1.5" fill="#bc8cff"><animate attributeName="opacity" values="1;0.4;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="84" r="1.2" fill="#58a6ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="6" cy="66" r="1.2" fill="#e6f1ff"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="78" cy="56" r="1.5" fill="#bc8cff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="90" cy="12" r="1" fill="#58a6ff"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>

  <circle cx="690" cy="18" r="1.8" fill="#58a6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="605" cy="12" r="1.3" fill="#e6f1ff"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="78" r="1.5" fill="#bc8cff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="24" r="1.2" fill="#58a6ff"><animate attributeName="opacity" values="1;0.4;1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="440" cy="80" r="1.1" fill="#e6f1ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="14" r="1.3" fill="#bc8cff"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="80" r="1.2" fill="#58a6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="20" r="1" fill="#e6f1ff"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- constellation cluster, top-left: a fuller "wing" outline -->
  <g stroke="#58a6ff" stroke-width="1" opacity="0.5">
    <line x1="14" y1="14" x2="34" y2="70"/>
    <line x1="34" y1="70" x2="66" y2="20"/>
    <line x1="66" y1="20" x2="18" y2="46"/>
    <line x1="18" y1="46" x2="6" y2="66"/>
    <line x1="66" y1="20" x2="78" y2="56"/>
    <line x1="78" y1="56" x2="90" y2="12"/>
  </g>

  <!-- small constellation cluster, bottom-right -->
  <g stroke="#bc8cff" stroke-width="0.8" opacity="0.4">
    <line x1="580" y1="78" x2="605" y2="12"/>
    <line x1="605" y1="12" x2="690" y2="18"/>
  </g>

  <!-- ringed planet with an orbiting moon, right side -->
  <g transform="translate(632,50)">
    <ellipse rx="26" ry="7" fill="none" stroke="#bc8cff" stroke-width="1.2" opacity="0.55" transform="rotate(-18)"/>
    <circle r="13" fill="url(#planetGrad)"/>
    <ellipse rx="26" ry="7" fill="none" stroke="#e6f1ff" stroke-width="0.8" opacity="0.35" transform="rotate(-18)" stroke-dasharray="2 4"/>
    <g>
      <circle cx="34" cy="0" r="3" fill="#e6f1ff"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- two shooting stars on independent timings -->
  <circle cx="0" cy="0" r="2.6" fill="#e6f1ff">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.55;0.6;0.7;1" dur="18s" repeatCount="indefinite"/>
    <animateMotion path="M 110,88 L 300,8" dur="18s" repeatCount="indefinite"/>
  </circle>
  <rect x="-24" y="-0.7" width="24" height="1.4" fill="url(#starGrad)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.55;0.6;0.7;1" dur="18s" repeatCount="indefinite"/>
    <animateMotion path="M 110,88 L 300,8" dur="18s" repeatCount="indefinite"/>
  </rect>

  <circle cx="0" cy="0" r="2.2" fill="#e6f1ff">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3;0.35;0.45;1" dur="26s" repeatCount="indefinite"/>
    <animateMotion path="M 500,92 L 380,10" dur="26s" repeatCount="indefinite"/>
  </circle>
  <rect x="-20" y="-0.6" width="20" height="1.2" fill="url(#starGrad2)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3;0.35;0.45;1" dur="26s" repeatCount="indefinite"/>
    <animateMotion path="M 500,92 L 380,10" dur="26s" repeatCount="indefinite"/>
  </rect>

  <!-- cycling taglines, unique to Malak -->
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Building interfaces, thinking in systems
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Currently investigating LLM code security
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="4s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Also writing stories in Arabic, poetry in English
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="8s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Still learning Japanese, one kanji at a time
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="12s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Somewhere between a compiler and a constellation
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="16s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Reading, researching, wondering what's next
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="20s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Debugging by day, stargazing by night
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="24s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Small steps, wide curiosity
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="28s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Angular by trade, wonderer by nature
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="32s" repeatCount="indefinite"/>
  </text>
  <text x="105" y="58" font-family="JetBrains Mono, monospace" font-size="20" fill="url(#textGrad)" opacity="0">
    Chasing questions across code and cosmos
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0125;0.0875;0.1" dur="40s" begin="36s" repeatCount="indefinite"/>
  </text>
</svg>
